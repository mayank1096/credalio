<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":820}}'>
class Component extends DCLogic {
  constructor(props) { super(props); const v = (props && props.variant) || 'none'; this.state = { a: v === 'right' ? [1, 1] : (v === 'wrong' ? [2, -1] : [-1, -1]) }; }
  renderVals() {
    const Q = [
      ['Multiple choice', 'You need to pay for validation. Where do the Credits come from?', ['Your earnings', 'Your Credit Wallet', 'The validator'], 1, 'Validation is paid from your Credit Wallet. Earnings stay separate.'],
      ['True or false', 'You can set any price you like for a course.', ['True', 'False'], 1, 'You choose within the range Credalio suggests.']
    ];
    const a = this.state.a;
    const qs = Q.map((q, qi) => {
      const pick = a[qi], ok = pick === q[3];
      return {
        n: 'Question ' + (qi + 1) + ' of ' + Q.length, kind: q[0], text: q[1], oc: q[2].length === 2 ? 'kc-two' : '',
        opts: q[2].map((label, oi) => ({ label, on: pick === oi ? 'true' : 'false', cls: pick === oi ? (oi === q[3] ? 'kc-right' : 'kc-wrong') : '', pick: () => { if (ok) return; const n = a.slice(); n[qi] = oi; this.setState({ a: n }); } })),
        fbShown: pick >= 0, fbCls: ok ? 'kc-fb-ok' : 'kc-fb-no', fbHead: ok ? 'Correct.' : 'Not quite.', fbText: ok ? q[4] : 'Have another look and try again.'
      };
    });
    const all = Q.every((q, i) => a[i] === q[3]);
    return { qs, nextCls: all ? '' : 'lp-off', nextDis: all ? 'false' : 'true', nextLabel: all ? 'Complete module' : 'Answer both to finish' };
  }
}
