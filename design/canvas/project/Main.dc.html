<style>
body{margin:0;background:#FFFFFF}
a{color:#1652F0}a:hover{color:#0E3BB8}
@keyframes cdFade{from{opacity:0}to{opacity:1}}
@keyframes cdDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes cdComet{0%{stroke-dashoffset:0.08;opacity:0}10%{opacity:1}85%{opacity:1}100%{stroke-dashoffset:-1;opacity:0}}
@keyframes cdPulse{0%{transform:scale(.7);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@keyframes cdChip{from{opacity:0;margin-top:10px}to{opacity:1;margin-top:0}}
@keyframes cdOrb{0%,100%{opacity:.55}50%{opacity:1}}
.cd-fade{animation:cdFade .6s ease both}
.cd-draw{stroke-dasharray:1;animation:cdDraw 1s cubic-bezier(.4,0,.2,1) both}
.cd-comet{stroke-dasharray:0.07 2;stroke-dashoffset:0.08;animation:cdComet 2.6s ease-in-out 1s infinite}
.cd-pulse{transform-box:fill-box;transform-origin:center;animation:cdPulse 2s ease-out .9s infinite}
.cd-chip{animation:cdChip .5s ease .7s both}
.cd-orb{animation:cdOrb 2.4s ease-in-out infinite}

.cd-card:hover{transform:translateY(-2px);border-color:#AFC1F5 !important}
.cd-card:active{transform:translateY(0) scale(.985)}
.cd-card:focus-visible,.cd-cta:focus-visible,.cd-ghost:focus-visible{outline:3px solid rgba(22,82,240,.45);outline-offset:3px}
.cd-cta{transition:background .2s ease,box-shadow .2s ease,transform .2s ease}
.cd-cta:hover{background:#0E3BB8 !important;color:#FFFFFF;transform:translateY(-1px)}
.cd-cta:active{transform:translateY(0) scale(.98)}
.cd-cta-arrow{transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.cd-cta:hover .cd-cta-arrow{transform:translateX(4px)}
.cd-ghost{transition:border-color .2s ease,background .2s ease}
.cd-ghost:hover{border-color:#1652F0 !important;background:#F5F8FF !important;color:#0B1433}
.cd-ic *{transform-box:fill-box}
@keyframes cdPop{0%{transform:scale(.6)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes cdBookL{0%{transform:rotateY(0) scaleX(.2)}60%{transform:scaleX(1.1)}100%{transform:scaleX(1)}}
@keyframes cdPencil{0%{transform:rotate(0)}20%{transform:rotate(-16deg)}45%{transform:rotate(10deg) translateX(1px)}70%{transform:rotate(-6deg)}100%{transform:rotate(0)}}
@keyframes cdDash{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes cdHop{0%,100%{transform:translateY(0)}40%{transform:translateY(-3px)}}
.cd-ic{animation:cdPop .5s cubic-bezier(.3,1.4,.5,1) both}
.cd-book-l{transform-origin:right center;animation:cdBookL .6s ease-out .05s both}
.cd-book-r{transform-origin:left center;animation:cdBookL .6s ease-out .15s both}
.cd-pencil{transform-origin:15% 85%;animation:cdPencil .8s ease-in-out .1s both}
.cd-line{stroke-dasharray:1;animation:cdDash .6s ease .35s both}
.cd-shield{transform-origin:center;animation:cdPop .5s cubic-bezier(.3,1.4,.5,1) both}
.cd-check{stroke-dasharray:1;animation:cdDash .45s ease .3s both}
.cd-p1{animation:cdHop .5s ease .1s 2}
.cd-p2{animation:cdHop .5s ease .25s 2}
@media (prefers-reduced-motion: reduce){.cd-ic,.cd-ic *{animation:none !important}.cd-fade,.cd-draw,.cd-comet,.cd-pulse,.cd-chip,.cd-orb{animation:none}.cd-comet{opacity:0}}
@media (max-width: 1080px){.cd-grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important;max-width:720px}}
@media (max-width: 760px){
.cd-root{height:auto !important;min-height:100vh !important;display:flex;flex-direction:column}
.cd-header{position:relative !important;height:64px !important;padding:0 20px !important;flex-shrink:0}
.cd-logo{width:28px !important;height:28px !important;border-radius:8px !important}
.cd-brand{font-size:18px !important}
.cd-hide-sm{display:none}
.cd-main{display:contents !important}
.cd-header{order:0}
.cd-h1{order:1;font-size:38px !important;line-height:1.1 !important;margin:16px 20px 0 20px !important}
.cd-illus{order:2;position:relative !important;flex-shrink:0;align-self:flex-start;height:240px !important;width:720px !important;margin-top:8px;transform:translateX(calc(-50% + var(--pan))) !important;transition:transform .6s cubic-bezier(.4,0,.2,1)}
.cd-grid{order:3;grid-template-columns:minmax(0,1fr) !important;width:calc(100% - 40px) !important;max-width:520px;align-self:center;gap:10px !important;margin-top:16px !important}
.cd-card{min-height:68px !important;padding:12px 14px 12px 12px !important;border-radius:16px !important}
.cd-ctawrap{order:4;align-self:center;width:calc(100% - 40px);max-width:520px;align-items:stretch !important;margin-top:24px !important;padding-bottom:32px}
.cd-cta{justify-content:space-between;height:56px !important;font-size:16px !important;padding:0 6px 0 24px !important}
.cd-ctawrap > span{text-align:center}
.cd-chip{font-size:12px !important;padding:6px 11px 6px 9px !important}
}

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":820}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 'create' }; }
  renderVals() {
    const sel = this.state.sel;
    const ctas = {"learn": "Start learning", "create": "Start creating", "validate": "Start validating", "institution": "Find my institution"};
    const ids = ['learn', 'create', 'validate', 'institution'];
    const c = {};
    const is = {};
    const not = {};
    ids.forEach((id) => {
      const on = sel === id;
      is[id] = on;
      not[id] = !on;
      c[id] = {
        pressed: on ? 'true' : 'false',
        pick: () => this.setState({ sel: id }),
        border: on ? '#1652F0' : '#E6EAF3',
        bg: on ? '#F5F8FF' : '#FFFFFF',
        shadow: on ? '0 0 0 4px rgba(22, 82, 240, 0.12), 0 12px 28px rgba(22, 82, 240, 0.16)' : '0 1px 2px rgba(11, 20, 51, 0.04)',
        iconBg: on ? '#1652F0' : '#EAF0FF',
        iconFg: on ? '#FFFFFF' : '#1652F0',
        radioBorder: on ? '#1652F0' : '#CBD3E6',
        radioBg: on ? '#1652F0' : '#FFFFFF',
        checkOpacity: on ? 1 : 0
      };
    });
    const pans = {"learn": 146, "create": 78, "validate": -56, "institution": -124};
    return { c, is, not, ctaLabel: ctas[sel], panX: pans[sel] };
  }
}
</script>
