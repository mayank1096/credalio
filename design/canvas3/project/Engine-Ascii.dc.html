<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Become Engine · ASCII road</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBFAF7}
.as-grain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.32;mix-blend-mode:multiply}
.as-card{position:absolute;left:0;top:0;transform-origin:50% 100%;will-change:transform,opacity;transition:opacity .5s ease}
.as-btn{transition:border-color .2s ease}
.as-btn:hover{border-color:#1652F0 !important}
.as-btn:focus-visible,.as-dot:focus-visible{outline:3px solid rgba(22,82,240,.45);outline-offset:3px}
</style>
</helmet>
<div ref="{{trackRef}}" style="position: relative; height: 420vh; background: #FBFAF7">
<section aria-labelledby="as-title" ref="{{viewRef}}" style="position: sticky; top: 0; height: 100vh; min-height: 640px; overflow: hidden; background: #FBFAF7; font-family: 'Google Sans', system-ui, sans-serif; color: #0B1433">
<canvas ref="{{canvasRef}}" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block"></canvas>
<svg class="as-grain" aria-hidden="true"><filter id="asNoise"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .42  0 0 0 .55 0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#asNoise)"></rect></svg>
<div class="as-card" ref="{{cardRef}}" aria-hidden="true">
<dc-import name="Moment" stage="{{cur.n}}" hint-size="280px,150px"></dc-import>
</div>

<div style="position: relative; z-index: 2; max-width: 1312px; height: 100%; margin: 0 auto; box-sizing: border-box; padding: clamp(48px, 9vh, 80px) 64px clamp(40px, 7vh, 64px); display: flex; flex-direction: column; justify-content: space-between; pointer-events: none">
<div style="display: flex; flex-direction: column; gap: 14px; max-width: 500px">
<span style="font-size: 14px; font-weight: 500; color: #1652F0">The Become Engine</span>
<h2 id="as-title" style="margin: 0; font-size: 44px; line-height: 1.08; font-weight: 600; letter-spacing: -1.3px">Every journey starts with a vision. We build the rest.</h2>
</div>
<div style="max-width: 420px; display: flex; flex-direction: column; gap: 16px; pointer-events: auto">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 500; color: #8A93AD">Stage {{cur.n}} of 8 · <span style="color: #1652F0">{{cur.name}}</span></span>
<h3 style="margin: 0; font-size: 26px; line-height: 1.2; font-weight: 600; letter-spacing: -.4px">{{cur.headline}}</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #4A5578">{{cur.detail}}</p>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<button class="as-btn" type="button" onClick="{{prev}}" aria-label="Previous stage" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; border: 1.5px solid #D6DDEE; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B1433" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<button class="as-btn" type="button" onClick="{{next}}" style="height: 44px; padding: 0 16px 0 18px; border-radius: 999px; background: #FFFFFF; border: 1.5px solid #D6DDEE; display: flex; align-items: center; gap: 8px; cursor: pointer; font-family: 'Google Sans', system-ui, sans-serif; font-size: 14px; font-weight: 600; color: #0B1433; white-space: nowrap">{{nextLabel}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B1433" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
<div style="display: flex; gap: 4px; margin-left: 6px">
<sc-for list="{{stages}}" as="st" hint-placeholder-count="8">
<button class="as-dot" type="button" onClick="{{st.pick}}" aria-label="Stage {{st.n}}: {{st.name}}" style="width: {{st.barW}}; height: 8px; padding: 0; border: none; border-radius: 999px; background: {{st.bar}}; cursor: pointer; transition: width .35s ease, background .35s ease"></button>
</sc-for>
</div>
</div>
</div>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { stage: 0 };
    this.pos = 0; this.target = 0; this.mode = 'auto'; this.dirty = true; this.lastShimmer = 0;
    var self = this;
    this.trackRef = function (el) { self.track = el; };
    this.viewRef = function (el) { self.view = el; };
    this.canvasRef = function (el) { self.cv = el; };
    this.cardRef = function (el) { self.card = el; };
  }
  componentDidMount() {
    var self = this;
    this.onScroll = function () {
      if (!self.track) return;
      var r = self.track.getBoundingClientRect(), span = r.height - window.innerHeight;
      if (span <= 0 || r.top > window.innerHeight || r.bottom < 0) return;
      self.mode = 'scroll'; clearInterval(self.timer);
      self.target = Math.min(1, Math.max(0, -r.top / span)) * 7;
    };
    this.onResize = function () { self.dirty = true; };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    window.addEventListener('resize', this.onResize);
    this.startTimer();
    var tick = function (now) {
      var d = self.target - self.pos, moving = Math.abs(d) > 0.0004;
      if (moving) { self.pos += d * 0.07; self.dirty = true; } else if (self.pos !== self.target) { self.pos = self.target; self.dirty = true; }
      if (now - self.lastShimmer > 140) { self.lastShimmer = now; self.dirty = true; self.seed = Math.floor(now / 140); }
      if (self.dirty) { self.draw(); self.dirty = false; }
      var s = Math.max(0, Math.min(7, Math.round(self.pos)));
      if (s !== self.state.stage) self.setState({ stage: s });
      self.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }
  componentWillUnmount() { cancelAnimationFrame(this.raf); clearInterval(this.timer); window.removeEventListener('scroll', this.onScroll); window.removeEventListener('resize', this.onResize); }
  startTimer() {
    var self = this;
    clearInterval(this.timer);
    if (this.mode !== 'auto') return;
    this.timer = setInterval(function () { self.target = self.target >= 7 ? 0 : Math.round(self.target) + 1; }, 4600);
  }
  goTo(i) {
    var s = Math.max(0, Math.min(7, i));
    if (this.mode === 'scroll' && this.track) {
      var r = this.track.getBoundingClientRect(), span = r.height - window.innerHeight;
      window.scrollTo({ top: window.scrollY + r.top + span * s / 7, behavior: 'smooth' });
    } else { this.target = s; this.startTimer(); }
  }
  draw() {
    var cv = this.cv, view = this.view;
    if (!cv || !view) return;
    var W = view.clientWidth, H = view.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
    var g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, H);
    var COB = '#1652F0', LIGHT = '#A9C2FF', PAPER = '#FBFAF7';
    var hash = function (a, b) { var h = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return h - Math.floor(h); };
    var smooth = function (e0, e1, x) { var t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };
    var camZ = 0.5 + 6 * this.pos;
    var hy = H * 0.24, f = W * 0.2, camH = 1.6 * (H - hy) / f, vpX = W * 0.71;
    var X = function (z) { return 2.4 * Math.sin(0.34 * z) + 1.2 * Math.sin(0.13 * z + 1); };
    var camX = X(camZ + 3.5);
    var proj = function (z, xo) { var d = z - camZ; return { x: vpX + ((X(z) + (xo || 0)) - camX) * f / d, y: hy + camH * f / d, s: f / d, d: d }; };
    // road rows
    var rows = [];
    for (var y = H + 4; y > hy + 3; y -= 2) {
      var dd = camH * f / (y - hy); if (dd > 34) break;
      var z = camZ + dd, cx = vpX + (X(z) - camX) * f / dd, hw = 0.82 * f / dd;
      rows.push({ y: y, cx: cx, hw: hw, d: dd, z: z });
    }
    var roadAt = function (yy) { var i = Math.round((H + 4 - yy) / 2); return rows[Math.max(0, Math.min(rows.length - 1, i))]; };
    // speckles on the left
    g.fillStyle = COB;
    for (var k = 0; k < 140; k++) { var sx = hash(k, 1) * W * 0.55, sy = hash(k, 2) * H; if (hash(k, 3) > 0.55) continue; g.globalAlpha = 0.35 + hash(k, 4) * 0.5; g.fillRect(sx, sy, 1 + hash(k, 5) * 1.6, 1 + hash(k, 6) * 1.6); }
    g.globalAlpha = 1;
    // ASCII hills
    var ramp = ['.', '·', ':', '+', 'x', 'o', '0', '8', '@'];
    var layers = [
      { base: 0.00, amp: 26, fx: 0.010, ph: 0.4, sp: 0.020, den: 0.30, depth: 70 },
      { base: 0.13, amp: 42, fx: 0.0072, ph: 2.1, sp: 0.045, den: 0.58, depth: 120 },
      { base: 0.33, amp: 70, fx: 0.0050, ph: 4.0, sp: 0.080, den: 0.86, depth: 200 }
    ];
    var ridge = function (L, x) { return hy + L.base * (H - hy) + L.amp * Math.sin(x * L.fx + L.ph + camZ * L.sp) + 0.45 * L.amp * Math.sin(x * L.fx * 2.3 + L.ph * 1.7 - camZ * L.sp * 0.6) - (x - W * 0.45) * 0.10; };
    var cw = 8, ch = 10, shimmer = this.seed || 0;
    g.font = '600 9px ui-monospace, Menlo, Consolas, monospace';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    for (var gy = Math.floor(hy / ch) * ch; gy < H; gy += ch) {
      var rr = roadAt(gy + ch / 2);
      for (var gx = Math.floor(W * 0.30 / cw) * cw; gx < W; gx += cw) {
        var px = gx + cw / 2, py = gy + ch / 2;
        if (rr && py > hy + 3 && Math.abs(px - rr.cx) < rr.hw + 7) continue;
        var fade = smooth(W * 0.34, W * 0.66, px);
        if (fade <= 0) continue;
        var li = -1, top = 0;
        for (var l = layers.length - 1; l >= 0; l--) { var t0 = ridge(layers[l], px); if (py >= t0) { li = l; top = t0; break; } }
        if (li < 0) continue;
        var L = layers[li];
        var slope = ridge(L, px + 6) - ridge(L, px - 6);
        var t = Math.min(1, (py - top) / L.depth);
        var light = 1 - Math.max(-0.35, Math.min(0.35, slope * 0.05));
        var dens = L.den * (0.28 + 0.72 * t) * light * fade;
        var r = hash(gx * 0.37 + (hash(gx, gy) > 0.985 ? shimmer : 0), gy * 0.53);
        if (r > dens * 1.15) continue;
        var idx = Math.max(0, Math.min(ramp.length - 1, Math.floor(dens * ramp.length + (r - 0.5) * 2)));
        g.fillStyle = (li === 0 || dens < 0.32) ? LIGHT : COB;
        g.globalAlpha = 0.55 + 0.45 * Math.min(1, dens * 1.3);
        if (dens > 0.6 && r < 0.55) { g.beginPath(); g.arc(px, py, 1.2 + dens * 2.2, 0, 6.283); if (r < 0.25) g.fill(); else { g.lineWidth = 1.2; g.strokeStyle = g.fillStyle; g.stroke(); } }
        else g.fillText(ramp[idx], px, py);
      }
    }
    g.globalAlpha = 1;
    // road surface
    if (rows.length > 2) {
      g.beginPath();
      rows.forEach(function (q, i) { if (i === 0) g.moveTo(q.cx - q.hw, q.y); else g.lineTo(q.cx - q.hw, q.y); });
      for (var i2 = rows.length - 1; i2 >= 0; i2--) g.lineTo(rows[i2].cx + rows[i2].hw, rows[i2].y);
      g.closePath(); g.fillStyle = PAPER; g.fill();
      // travelled halftone up to the current marker
      var stageZ = 4 + 6 * Math.max(0, Math.min(7, Math.ceil((camZ - 2) / 6)));
      g.fillStyle = LIGHT;
      rows.forEach(function (q, i) {
        if (i % 3 || q.z > stageZ) return;
        var step = Math.max(3, q.hw * 0.06);
        for (var xx = q.cx - q.hw + step; xx < q.cx + q.hw - step; xx += step) { var rd = Math.max(0.3, Math.min(1.4, q.hw * 0.006)); g.beginPath(); g.arc(xx + ((i / 3) % 2) * step / 2, q.y, rd, 0, 6.283); g.fill(); }
      });
      // edges with slight misregistration
      var edge = function (sign, col, off, w) {
        g.beginPath();
        rows.forEach(function (q, i) { var ex = q.cx + sign * q.hw + off; if (i === 0) g.moveTo(ex, q.y + off); else g.lineTo(ex, q.y + off); });
        g.strokeStyle = col; g.lineWidth = w; g.stroke();
      };
      edge(-1, LIGHT, 1.2, 1.6); edge(1, LIGHT, 1.2, 1.6); edge(-1, COB, 0, 2); edge(1, COB, 0, 2);
      // centre dashes
      g.strokeStyle = COB; g.lineCap = 'round';
      for (var i3 = 1; i3 < rows.length; i3++) {
        var a = rows[i3 - 1], b = rows[i3];
        if (Math.floor(b.z * 1.4) % 2) continue;
        g.lineWidth = Math.max(0.8, Math.min(6, b.hw * 0.045));
        g.beginPath(); g.moveTo(a.cx, a.y); g.lineTo(b.cx, b.y); g.stroke();
      }
    }
    // markers
    var cur = Math.max(0, Math.min(7, Math.ceil((camZ - 2) / 6))), cardPos = null;
    for (var m = 7; m >= 0; m--) {
      var zm = 4 + 6 * m; if (zm - camZ < 0.9) continue;
      var p = proj(zm), rad = Math.max(1.5, p.s * 0.16);
      if (p.y > H + 40 || p.d > 34) continue;
      if (m === cur) {
        // beam of fading dots
        g.fillStyle = LIGHT;
        for (var by = 0; by < 14; by++) { g.globalAlpha = 0.55 * (1 - by / 14); for (var bx = -2; bx <= 2; bx++) { g.beginPath(); g.arc(p.x + bx * rad * 0.28, p.y - rad * 1.6 - by * rad * 0.42, Math.max(0.6, rad * 0.06), 0, 6.283); g.fill(); } }
        g.globalAlpha = 1;
        // rings on the road
        g.strokeStyle = LIGHT; g.lineWidth = 1.5;
        [1.9, 2.8].forEach(function (k) { g.beginPath(); g.ellipse(p.x, p.y, rad * k, rad * k * 0.32, 0, 0, 6.283); g.stroke(); });
        // ink ball
        var gr = g.createRadialGradient(p.x - rad * 0.35, p.y - rad * 1.35, rad * 0.1, p.x, p.y - rad, rad * 1.1);
        gr.addColorStop(0, '#5B86F5'); gr.addColorStop(0.55, COB); gr.addColorStop(1, '#0E3BB8');
        g.fillStyle = gr; g.beginPath(); g.arc(p.x, p.y - rad, rad, 0, 6.283); g.fill();
        g.fillStyle = PAPER; g.beginPath(); g.ellipse(p.x - rad * 0.38, p.y - rad * 1.42, rad * 0.24, rad * 0.15, -0.6, 0, 6.283); g.fill();
        // halftone shading on the lower right
        g.fillStyle = '#0B2A8F';
        for (var hx = -3; hx <= 3; hx++) for (var hy2 = -3; hy2 <= 3; hy2++) { var ox = hx * rad * 0.22, oy = hy2 * rad * 0.22; var dist = Math.hypot(ox, oy); if (dist > rad * 0.9 || ox + oy < rad * 0.25) continue; g.beginPath(); g.arc(p.x + ox, p.y - rad + oy, rad * 0.05, 0, 6.283); g.fill(); }
        cardPos = { x: p.x, y: p.y - rad * 2.2 - 20, s: Math.min(1, Math.max(0.45, 3.5 / p.d)) };
      } else {
        g.fillStyle = PAPER; g.strokeStyle = COB; g.lineWidth = Math.max(1, rad * 0.18);
        g.beginPath(); g.ellipse(p.x, p.y, rad * 1.1, rad * 0.5, 0, 0, 6.283); g.fill(); g.stroke();
        if (m > cur) { g.fillStyle = LIGHT; for (var b2 = 1; b2 < 6; b2++) { g.globalAlpha = 0.5 * (1 - b2 / 6); g.beginPath(); g.arc(p.x, p.y - b2 * rad * 0.6, Math.max(0.5, rad * 0.07), 0, 6.283); g.fill(); } g.globalAlpha = 1; }
      }
    }
    if (this.card) {
      if (cardPos) { this.card.style.opacity = '1'; this.card.style.transform = 'translate(' + (cardPos.x - 140).toFixed(1) + 'px,' + (cardPos.y - 160).toFixed(1) + 'px) scale(' + cardPos.s.toFixed(3) + ')'; }
      else this.card.style.opacity = '0';
    }
  }
  renderVals() {
    var self = this;
    var eng = [
      ['Vision', 'Start with who you want to become.', 'Tell us your goal in your own words: a role, a skill, a career change.'],
      ['Discover', 'See the possibilities ahead.', 'Explore the roles and skills linked to your goal, and the gap between today and where you want to be.'],
      ['AI Coach', 'Turn your goal into a personal journey.', 'Your AI Coach maps the route and adapts it as you learn.'],
      ['Learn', 'Build the knowledge you need.', 'Courses, lessons and resources from trusted creators and institutions.'],
      ['Practise', 'Turn knowledge into capability.', 'Projects, exercises and simulations, with feedback while you work.'],
      ['Connect', 'Learn with people when it matters.', 'Tutors, peers and experts who answer questions and review your work.'],
      ['Prove', 'Show what you can actually do.', 'Verified work becomes evidence, kept in your Digital Backpack.'],
      ['Advance', 'Use what you’ve proven to move forward.', 'A new role, the next level or a fresh goal. Then the engine starts again.']
    ];
    var si = this.state.stage, c = eng[si];
    var stages = eng.map(function (s, k) {
      var on = k === si, done = k < si;
      return { n: k + 1, name: s[0], bar: on ? '#1652F0' : (done ? '#A9C2FF' : '#E6E3DA'), barW: on ? '24px' : '8px', pick: function () { self.goTo(k); } };
    });
    return {
      stages: stages,
      cur: { n: si + 1, name: c[0], headline: c[1], detail: c[2] },
      nextLabel: si < 7 ? 'Next: ' + eng[si + 1][0] : 'Start again',
      next: function () { self.goTo(si < 7 ? si + 1 : 0); },
      prev: function () { self.goTo(si - 1); },
      trackRef: this.trackRef, viewRef: this.viewRef, canvasRef: this.canvasRef, cardRef: this.cardRef
    };
  }
}
</script>
</body>
</html>
