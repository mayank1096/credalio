<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Become Engine · gyroscope</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
.gy-box{position:relative;width:660px;height:660px;perspective:1600px}
.gy-tilt{position:absolute;left:50%;top:50%;transform-style:preserve-3d;transition:transform 1.3s cubic-bezier(.65,0,.35,1)}
.gy-spin{position:absolute;left:0;top:0;transform-style:preserve-3d;animation:gySpin linear infinite}
@keyframes gySpin{to{transform:rotateZ(360deg)}}
.gy-ring{position:absolute;border-radius:999px;transition:border-color .6s ease,border-width .6s ease,box-shadow .6s ease}
.gy-bead{position:absolute;left:50%;top:0;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:width .6s ease,height .6s ease,margin .6s ease,background .6s ease,border-color .6s ease,box-shadow .6s ease}
.gy-bead:focus-visible,.gy-btn:focus-visible,.gy-row:focus-visible{outline:3px solid rgba(22,82,240,.45);outline-offset:3px}
.gy-core{animation:gyCore 3.6s ease-in-out infinite}
@keyframes gyCore{0%,100%{box-shadow:0 0 0 0 rgba(22,82,240,.25),0 0 60px 10px rgba(22,82,240,.35)}50%{box-shadow:0 0 0 22px rgba(22,82,240,0),0 0 80px 18px rgba(22,82,240,.45)}}
.gy-btn{transition:border-color .2s ease}
.gy-btn:hover{border-color:#1652F0 !important}
.gy-swap{animation:gySwap .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes gySwap{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.gy-spin,.gy-core,.gy-swap{animation:none}.gy-tilt{transition:none}}
</style>
</helmet>
<section aria-labelledby="gy-title" style="position: relative; width: 100%; height: 820px; overflow: hidden; background: radial-gradient(60% 70% at 72% 50%, #EAF0FF 0%, #FFFFFF 70%); font-family: 'Google Sans', system-ui, sans-serif; color: #0B1433">
<div style="max-width: 1312px; height: 100%; margin: 0 auto; box-sizing: border-box; padding: 0 64px; display: grid; grid-template-columns: minmax(0, 1fr) 660px; gap: 40px; align-items: center">
<div style="display: flex; flex-direction: column; gap: 28px; max-width: 520px">
<div style="display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 14px; font-weight: 500; color: #1652F0">The Become Engine</span>
<h2 id="gy-title" style="margin: 0; font-size: 44px; line-height: 1.08; font-weight: 600; letter-spacing: -1.3px">Every journey starts with a vision. We build the rest.</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.55; color: #4A5578">Eight connected stages, always turning, from knowing where you want to go to proving you got there.</p>
</div>
<div class="gy-swap" style="display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 14px; font-weight: 500; color: #8A93AD">Stage {{cur.n}} of 8 · <span style="color: #1652F0">{{cur.name}}</span></span>
<h3 style="margin: 0; font-size: 26px; line-height: 1.2; font-weight: 600; letter-spacing: -.4px">{{cur.headline}}</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #4A5578">{{cur.detail}}</p>
<dc-import name="Moment" stage="{{cur.n}}" hint-size="280px,150px"></dc-import>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<button class="gy-btn" type="button" onClick="{{prev}}" aria-label="Previous stage" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; border: 1.5px solid #D6DDEE; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B1433" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<button class="gy-btn" type="button" onClick="{{next}}" style="height: 44px; padding: 0 16px 0 18px; border-radius: 999px; background: #FFFFFF; border: 1.5px solid #D6DDEE; display: flex; align-items: center; gap: 8px; cursor: pointer; font-family: 'Google Sans', system-ui, sans-serif; font-size: 14px; font-weight: 600; color: #0B1433; white-space: nowrap">{{nextLabel}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B1433" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>
</div>

<div class="gy-box" aria-label="The eight stages turning like an engine">
<sc-for list="{{rings}}" as="r" hint-placeholder-count="8">
<div class="gy-tilt" style="transform: {{r.tilt}}">
<div class="gy-spin" style="animation-duration: {{r.dur}}; animation-direction: {{r.dir}}">
<div class="gy-ring" style="left: {{r.off}}; top: {{r.off}}; width: {{r.d}}; height: {{r.d}}; border: {{r.bw}} solid {{r.col}}; box-shadow: {{r.glow}}"></div>
<button class="gy-bead" type="button" onClick="{{r.pick}}" aria-pressed="{{r.pressed}}" aria-label="Stage {{r.n}}: {{r.name}}" style="left: 0; top: {{r.off}}; width: {{r.bs}}; height: {{r.bs}}; margin: {{r.bm}}; background: {{r.bg}}; border: 1.5px solid {{r.bb}}; box-shadow: {{r.bglow}}"><svg width="{{r.is}}" height="{{r.is}}" viewBox="0 0 24 24" fill="none" stroke="{{r.fg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg></button>
</div>
</div>
</sc-for>
<div aria-hidden="true" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%)">
<div class="gy-core" style="width: 132px; height: 132px; border-radius: 999px; background: radial-gradient(circle at 36% 30%, #A9C2FF 0%, #4C7DFF 34%, #1652F0 66%, #0E3BB8 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #FFFFFF">
<span style="font-size: 40px; line-height: 1; font-weight: 600; letter-spacing: -1px; text-shadow: 0 2px 10px rgba(11,20,51,.35)">0{{cur.n}}</span>
<span style="font-size: 13px; font-weight: 600; text-shadow: 0 1px 6px rgba(11,20,51,.35)">{{cur.name}}</span>
</div>
</div>
</div>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":820}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { stage: 0 }; }
  componentDidMount() { this.startTimer(); }
  componentWillUnmount() { clearInterval(this.timer); }
  startTimer() {
    var self = this;
    clearInterval(this.timer);
    this.timer = setInterval(function () { self.setState({ stage: (self.state.stage + 1) % 8 }); }, 4600);
  }
  goTo(i) { this.setState({ stage: (i + 8) % 8 }); this.startTimer(); }
  renderVals() {
    var self = this;
    var eng = [
      ['Vision', 'Start with who you want to become.', 'Tell us your goal in your own words: a role, a skill, a career change.', 'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z'],
      ['Discover', 'See the possibilities ahead.', 'Explore the roles and skills linked to your goal, and the gap between today and where you want to be.', 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM15.5 8.5l-2 5-5 2 2-5z'],
      ['AI Coach', 'Turn your goal into a personal journey.', 'Your AI Coach maps the route and adapts it as you learn.', 'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z'],
      ['Learn', 'Build the knowledge you need.', 'Courses, lessons and resources from trusted creators and institutions.', 'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 5v16'],
      ['Practise', 'Turn knowledge into capability.', 'Projects, exercises and simulations, with feedback while you work.', 'M8 6l-6 6 6 6M16 6l6 6-6 6'],
      ['Connect', 'Learn with people when it matters.', 'Tutors, peers and experts who answer questions and review your work.', 'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21v-1a6 6 0 0 1 12 0v1M16 3.5a4 4 0 0 1 0 7M22 21v-1a6 6 0 0 0-4-5.6'],
      ['Prove', 'Show what you can actually do.', 'Verified work becomes evidence, kept in your Digital Backpack.', 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM8.5 12l2.5 2.5 4.5-5'],
      ['Advance', 'Use what you’ve proven to move forward.', 'A new role, the next level or a fresh goal. Then the engine starts again.', 'M7 17L17 7M9 7h8v8']
    ];
    var tilts = [[68, 0], [62, 45], [70, 90], [58, 135], [66, 22], [60, 112], [72, 68], [64, 158]];
    var si = this.state.stage;
    var rings = eng.map(function (s, k) {
      var on = k === si, done = k < si;
      var d = 190 + k * 58;
      var t = tilts[k];
      return {
        n: k + 1, name: s[0], icon: s[3], pressed: on ? 'true' : 'false',
        d: d + 'px', off: (-d / 2) + 'px',
        tilt: on ? 'rotateZ(0deg) rotateX(0deg) rotateY(0deg)' : 'rotateZ(' + t[1] + 'deg) rotateX(' + t[0] + 'deg) rotateY(0deg)',
        dur: on ? (60 + k * 6) + 's' : (14 + k * 4) + 's', dir: k % 2 ? 'reverse' : 'normal',
        bw: on ? '3px' : '1.5px',
        col: on ? '#1652F0' : (done ? 'rgba(22,82,240,.45)' : 'rgba(22,82,240,.18)'),
        glow: on ? '0 0 0 6px rgba(22,82,240,.08), 0 0 40px rgba(22,82,240,.35)' : 'none',
        bs: on ? '52px' : '30px', bm: on ? '-26px 0 0 -26px' : '-15px 0 0 -15px', is: on ? '22' : '14',
        bg: on ? '#1652F0' : (done ? '#EAF0FF' : '#FFFFFF'),
        bb: on ? '#1652F0' : (done ? '#C9D7FA' : '#D6DDEE'),
        fg: on ? '#FFFFFF' : (done ? '#1652F0' : '#8A93AD'),
        bglow: on ? '0 0 0 8px rgba(22,82,240,.15), 0 12px 24px -10px rgba(22,82,240,.7)' : '0 4px 10px -6px rgba(11,20,51,.3)',
        pick: function () { self.goTo(k); }
      };
    });
    var c = eng[si];
    return {
      rings: rings,
      cur: { n: si + 1, name: c[0], headline: c[1], detail: c[2] },
      nextLabel: si < 7 ? 'Next: ' + eng[si + 1][0] : 'Start again',
      next: function () { self.goTo(si + 1); },
      prev: function () { self.goTo(si - 1); }
    };
  }
}
</script>
</body>
</html>
