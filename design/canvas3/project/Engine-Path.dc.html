<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Become Engine · journey flythrough</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
.pv-plane{position:absolute;left:64%;top:72%;width:3200px;height:3600px;transform-origin:0 0;transform-style:preserve-3d;will-change:transform;backface-visibility:hidden}
.pv-grid{position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,rgba(22,82,240,.06) 0 2px,transparent 2px 200px),repeating-linear-gradient(90deg,rgba(22,82,240,.06) 0 2px,transparent 2px 200px)}
.pv-node{position:absolute;width:0;height:0;transform-style:preserve-3d}
.pv-orb{position:absolute;border-radius:999px;display:flex;align-items:center;justify-content:center;transition:width .6s cubic-bezier(.3,1.3,.5,1),height .6s cubic-bezier(.3,1.3,.5,1),margin .6s cubic-bezier(.3,1.3,.5,1),background .5s ease,box-shadow .5s ease}
.pv-halo{position:absolute;left:-60px;top:-60px;width:120px;height:120px;border-radius:999px;border:3px solid rgba(76,125,255,.55);animation:pvHalo 2.4s cubic-bezier(.2,.6,.3,1) infinite;will-change:transform,opacity}
.pv-halo-2{animation-delay:1.2s}
@keyframes pvHalo{0%{transform:scale(.7);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.pv-beam{position:absolute;left:0;top:0;width:110px;height:340px;transform-origin:50% 100%;transform:translate(-50%,-100%) rotateX(-64deg);background:radial-gradient(50% 100% at 50% 100%,rgba(76,125,255,.45) 0%,rgba(76,125,255,.12) 55%,rgba(76,125,255,0) 100%);transition:opacity .6s ease;pointer-events:none}
.pv-card{position:absolute;transform-origin:50% 100%;transition:opacity .7s ease}
.pv-prog{transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)}
.pv-btn{transition:border-color .2s ease}
.pv-btn:hover{border-color:#1652F0 !important}
.pv-btn:focus-visible,.pv-dot:focus-visible{outline:3px solid rgba(22,82,240,.45);outline-offset:3px}
@media (prefers-reduced-motion: reduce){.pv-halo{animation:none;opacity:0}.pv-prog,.pv-card,.pv-orb{transition:none}}
</style>
</helmet>
<div class="pv-track" ref="{{trackRef}}" style="position: relative; height: 420vh; background: #FFFFFF">
<section aria-labelledby="pv-title" style="position: sticky; top: 0; height: 100vh; min-height: 640px; overflow: hidden; background: linear-gradient(180deg, #FFFFFF 0%, #F3F6FE 100%); font-family: 'Google Sans', system-ui, sans-serif; color: #0B1433">
<div aria-hidden="true" style="position: absolute; inset: 0; perspective: 900px; perspective-origin: 64% 16%">
<div class="pv-plane" ref="{{planeRef}}" style="transform: rotateX(64deg) translate(-1600px, -3200px)">
<div class="pv-grid"></div>
<svg viewBox="0 0 3200 3600" style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible">
<path d="{{roadD}}" fill="none" stroke="#1652F0" stroke-opacity=".07" stroke-width="320" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="{{roadD}}" fill="none" stroke="#C9D7FA" stroke-width="184" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="{{roadD}}" fill="none" stroke="#FFFFFF" stroke-width="172" stroke-linecap="round" stroke-linejoin="round"></path>
<path class="pv-prog" d="{{stageD}}" fill="none" stroke="#EAF0FF" stroke-width="172" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="{{progOff}}"></path>
<path d="{{roadD}}" fill="none" stroke="#A9C2FF" stroke-width="7" stroke-linecap="round" stroke-dasharray="40 36"></path>
<path class="pv-prog" d="{{stageD}}" fill="none" stroke="#1652F0" stroke-width="9" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="{{progOff}}"></path>
</svg>
<sc-for list="{{stages}}" as="st" hint-placeholder-count="8">
<div class="pv-node" style="left: {{st.x}}; top: {{st.y}}">
<sc-if value="{{st.on}}" hint-placeholder-val="{{ false }}"><span class="pv-halo"></span><span class="pv-halo pv-halo-2"></span></sc-if>
<span class="pv-orb" style="width: {{st.size}}; height: {{st.size}}; margin: {{st.m}}; background: {{st.orb}}; box-shadow: {{st.shadow}}"><svg width="{{st.is}}" height="{{st.is}}" viewBox="0 0 24 24" fill="none" stroke="{{st.fg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{st.icon}}"></path></svg></span>
</div>
</sc-for>
<sc-for list="{{stages}}" as="st" hint-placeholder-count="8">
<div class="pv-beam" style="left: {{st.x}}; top: {{st.y}}; opacity: {{st.beam}}"></div>
<div class="pv-card" style="left: {{st.x}}; top: {{st.y}}; transform: translate(-50%, -100%) rotateX(-64deg) translateY(-70px) scale(1.25); opacity: {{st.op}}">
<dc-import name="Moment" stage="{{st.n}}" hint-size="280px,150px"></dc-import>
</div>
</sc-for>
</div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, #FFFFFF 26%, rgba(255,255,255,0) 52%), radial-gradient(120% 90% at 64% 70%, rgba(255,255,255,0) 55%, #FFFFFF 100%); pointer-events: none"></div>

<div style="position: relative; z-index: 2; max-width: 1312px; height: 100%; margin: 0 auto; box-sizing: border-box; padding: clamp(48px, 9vh, 80px) 64px clamp(40px, 7vh, 64px); display: flex; flex-direction: column; justify-content: space-between; pointer-events: none">
<div style="display: flex; flex-direction: column; gap: 14px; max-width: 520px">
<span style="font-size: 14px; font-weight: 500; color: #1652F0">The Become Engine</span>
<h2 id="pv-title" style="margin: 0; font-size: 44px; line-height: 1.08; font-weight: 600; letter-spacing: -1.3px">Every journey starts with a vision. We build the rest.</h2>
</div>
<div style="max-width: 440px; display: flex; flex-direction: column; gap: 16px; pointer-events: auto">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 500; color: #8A93AD">Stage {{cur.n}} of 8 · <span style="color: #1652F0">{{cur.name}}</span></span>
<h3 style="margin: 0; font-size: 26px; line-height: 1.2; font-weight: 600; letter-spacing: -.4px">{{cur.headline}}</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #4A5578">{{cur.detail}}</p>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<button class="pv-btn" type="button" onClick="{{prev}}" aria-label="Previous stage" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; border: 1.5px solid #D6DDEE; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B1433" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<button class="pv-btn" type="button" onClick="{{next}}" style="height: 44px; padding: 0 16px 0 18px; border-radius: 999px; background: #FFFFFF; border: 1.5px solid #D6DDEE; display: flex; align-items: center; gap: 8px; cursor: pointer; font-family: 'Google Sans', system-ui, sans-serif; font-size: 14px; font-weight: 600; color: #0B1433; white-space: nowrap">{{nextLabel}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B1433" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
<div style="display: flex; gap: 4px; margin-left: 6px">
<sc-for list="{{stages}}" as="st" hint-placeholder-count="8">
<button class="pv-dot" type="button" onClick="{{st.pick}}" aria-label="Stage {{st.n}}: {{st.name}}" style="width: {{st.barW}}; height: 8px; padding: 0; border: none; border-radius: 999px; background: {{st.bar}}; cursor: pointer; transition: width .35s ease, background .35s ease"></button>
</sc-for>
</div>
</div>
</div>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { stage: 0 };
    this.pos = 0; this.target = 0; this.mode = 'auto';
    var P = [[1600, 3200], [1220, 2780], [1660, 2360], [1260, 1940], [1700, 1520], [1300, 1100], [1700, 700], [1480, 300]];
    this.P = P;
    this.E = [[1880, 3700]].concat(P, [[1300, -200]]);
    var self = this;
    this.planeRef = function (el) { self.plane = el; };
    this.trackRef = function (el) { self.track = el; };
  }
  componentDidMount() {
    var self = this;
    this.onScroll = function () {
      if (!self.track) return;
      var r = self.track.getBoundingClientRect(), span = r.height - window.innerHeight;
      if (span <= 0) return;
      if (r.top > window.innerHeight || r.bottom < 0) return;
      self.mode = 'scroll'; clearInterval(self.timer);
      self.target = Math.min(1, Math.max(0, -r.top / span)) * 7;
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    this.startTimer();
    var tick = function () {
      var d = self.target - self.pos;
      self.pos = Math.abs(d) < 0.0005 ? self.target : self.pos + d * 0.085;
      self.place(self.pos);
      var s = Math.max(0, Math.min(7, Math.round(self.pos)));
      if (s !== self.state.stage) self.setState({ stage: s });
      self.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }
  componentWillUnmount() { cancelAnimationFrame(this.raf); clearInterval(this.timer); window.removeEventListener('scroll', this.onScroll); }
  startTimer() {
    var self = this;
    clearInterval(this.timer);
    if (this.mode !== 'auto') return;
    this.timer = setInterval(function () { self.target = self.target >= 7 ? 0 : Math.round(self.target) + 1; }, 4600);
  }
  place(p) {
    if (!this.plane) return;
    var E = this.E, i = Math.min(6, Math.floor(p)), t = p - i;
    var a = E[i], b = E[i + 1], c = E[i + 2], d = E[i + 3];
    var t2 = t * t, t3 = t2 * t;
    var f = function (k) { return 0.5 * ((2 * b[k]) + (-a[k] + c[k]) * t + (2 * a[k] - 5 * b[k] + 4 * c[k] - d[k]) * t2 + (-a[k] + 3 * b[k] - 3 * c[k] + d[k]) * t3); };
    this.plane.style.transform = 'rotateX(64deg) translate3d(' + (-f(0)).toFixed(1) + 'px, ' + (-f(1)).toFixed(1) + 'px, 0)';
  }
  goTo(i) {
    var s = Math.max(0, Math.min(7, i));
    if (this.mode === 'scroll' && this.track) {
      var r = this.track.getBoundingClientRect(), span = r.height - window.innerHeight;
      window.scrollTo({ top: window.scrollY + r.top + span * s / 7, behavior: 'smooth' });
    } else { this.target = s; this.startTimer(); }
  }
  renderVals() {
    var self = this;
    var eng = [
      ['Vision', 'Start with who you want to become.', 'Tell us your goal in your own words: a role, a skill, a career change.', 'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z'],
      ['Discover', 'See the possibilities ahead.', 'Explore the roles and skills linked to your goal, and the gap between today and where you want to be.', 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM15.5 8.5l-2 5-5 2 2-5z'],
      ['AI Coach', 'Turn your goal into a personal journey.', 'Your AI Coach maps the route and adapts it as you learn.', 'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z'],
      ['Learn', 'Build the knowledge you need.', 'Courses, lessons and resources from trusted creators and institutions.', 'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 5v16'],
      ['Practise', 'Turn knowledge into capability.', 'Projects, exercises and simulations, with feedback while you work.', 'M8 6l-6 6 6 6M16 6l6 6-6 6'],
      ['Connect', 'Learn with people when it matters.', 'Tutors, peers and experts who answer questions and review your work.', 'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21v-1a6 6 0 0 1 12 0v1M16 3.5a4 4 0 0 1 0 7M22 21v-1a6 6 0 0 0-4-5.6'],
      ['Prove', 'Show what you can actually do.', 'Verified work becomes evidence, kept in your Digital Backpack.', 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM8.5 12l2.5 2.5 4.5-5'],
      ['Advance', 'Use what you’ve proven to move forward.', 'A new role, the next level or a fresh goal. Then the engine starts again.', 'M7 17L17 7M9 7h8v8']
    ];
    var E = this.E, P = this.P;
    var seg = function (i) {
      var a = E[i], b = E[i + 1], c = E[i + 2], d = E[i + 3];
      return ' C' + (b[0] + (c[0] - a[0]) / 6).toFixed(1) + ' ' + (b[1] + (c[1] - a[1]) / 6).toFixed(1) + ' ' + (c[0] - (d[0] - b[0]) / 6).toFixed(1) + ' ' + (c[1] - (d[1] - b[1]) / 6).toFixed(1) + ' ' + c[0] + ' ' + c[1];
    };
    var stageD = 'M' + P[0][0] + ' ' + P[0][1];
    for (var i = 0; i < 7; i++) stageD += seg(i);
    var roadD = 'M' + E[0][0] + ' ' + E[0][1] + ' L' + P[0][0] + ' ' + P[0][1] + stageD.slice(stageD.indexOf(' C')) + ' L' + E[9][0] + ' ' + E[9][1];
    var si = this.state.stage;
    var stages = eng.map(function (s, k) {
      var on = k === si, done = k < si;
      return {
        n: k + 1, name: s[0], icon: s[3], on: on,
        x: P[k][0] + 'px', y: P[k][1] + 'px',
        size: on ? '108px' : '70px', m: on ? '-54px 0 0 -54px' : '-35px 0 0 -35px', is: on ? '44' : '28',
        orb: on ? 'radial-gradient(circle at 34% 28%, #DCE7FF 0%, #7FA4FF 18%, #1652F0 52%, #0B2A8F 100%)' : (done ? 'radial-gradient(circle at 34% 28%, #FFFFFF 0%, #DCE5FB 70%)' : 'radial-gradient(circle at 34% 28%, #FFFFFF 0%, #EEF2FA 75%)'),
        shadow: on ? 'inset -10px -12px 22px rgba(11,20,51,.35), inset 8px 10px 16px rgba(255,255,255,.35), 0 0 0 12px rgba(22,82,240,.16), 0 0 60px 14px rgba(76,125,255,.55)' : 'inset -6px -8px 12px rgba(11,20,51,.08), 0 0 0 4px rgba(255,255,255,.9), 0 10px 20px -8px rgba(11,20,51,.35)',
        fg: on ? '#FFFFFF' : (done ? '#1652F0' : '#8A93AD'),
        beam: on ? 1 : 0,
        op: k < si ? 0 : (on ? 1 : (k - si < 3 ? 0.5 : 0)),
        bar: on ? '#1652F0' : (done ? '#C9D7FA' : '#E6EAF3'), barW: on ? '24px' : '8px',
        pick: function () { self.goTo(k); }
      };
    });
    var c = eng[si];
    return {
      stages: stages, roadD: roadD, stageD: stageD,
      progOff: (1 - si / 7).toFixed(4),
      cur: { n: si + 1, name: c[0], headline: c[1], detail: c[2] },
      nextLabel: si < 7 ? 'Next: ' + eng[si + 1][0] : 'Start again',
      next: function () { self.goTo(si < 7 ? si + 1 : 0); },
      prev: function () { self.goTo(si - 1); },
      planeRef: this.planeRef, trackRef: this.trackRef
    };
  }
}
</script>
</body>
</html>
