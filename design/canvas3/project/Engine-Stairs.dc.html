<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Become Engine · staircase</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
.st-box{position:relative;width:700px;height:680px;perspective:2000px;perspective-origin:50% 30%}
.st-world{position:absolute;left:44%;top:70%;width:0;height:0;transform-style:preserve-3d;transform:rotateX(58deg) rotateZ(-38deg)}
.st-tile{position:absolute;width:104px;height:104px;margin:-52px 0 0 -52px;transform-style:preserve-3d;cursor:pointer;padding:0;border:none;background:none}
.st-top{position:absolute;inset:0;border-radius:16px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:background .6s ease,border-color .6s ease,box-shadow .6s ease}
.st-side{position:absolute;transition:background .6s ease}
.st-sa{left:8px;right:8px;top:100%;transform-origin:50% 0;transform:rotateX(-90deg)}
.st-sb{top:8px;bottom:8px;left:100%;transform-origin:0 50%;transform:rotateY(90deg)}
.st-bill{position:absolute;left:50%;top:50%;transform-style:preserve-3d;transition:left 1.1s cubic-bezier(.65,0,.35,1),top 1.1s cubic-bezier(.65,0,.35,1),transform 1.1s cubic-bezier(.65,0,.35,1);pointer-events:none}
.st-up{position:absolute;left:0;bottom:0;transform:rotateZ(38deg) rotateX(-58deg);transform-origin:0 100%}
.st-orb{animation:stBob 2.4s ease-in-out infinite}
@keyframes stBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.st-tile:focus-visible .st-top{outline:3px solid rgba(22,82,240,.45);outline-offset:3px}
.gy-btn:focus-visible{outline:3px solid rgba(22,82,240,.45);outline-offset:3px}
.gy-btn{transition:border-color .2s ease}
.gy-btn:hover{border-color:#1652F0 !important}
.gy-swap{animation:gySwap .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes gySwap{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.st-door{animation:stDoor 3s ease-in-out infinite}
@keyframes stDoor{0%,100%{box-shadow:0 0 30px 6px rgba(255,214,140,.55),inset 0 0 18px rgba(255,255,255,.9)}50%{box-shadow:0 0 44px 12px rgba(255,214,140,.75),inset 0 0 22px rgba(255,255,255,1)}}
@media (prefers-reduced-motion: reduce){.st-orb,.st-door,.gy-swap{animation:none}.st-bill{transition:none}}
</style>
</helmet>
<section aria-labelledby="st-title" style="position: relative; width: 100%; height: 820px; overflow: hidden; background: radial-gradient(60% 70% at 72% 60%, #EAF0FF 0%, #FFFFFF 70%); font-family: 'Google Sans', system-ui, sans-serif; color: #0B1433">
<div style="max-width: 1312px; height: 100%; margin: 0 auto; box-sizing: border-box; padding: 0 64px; display: grid; grid-template-columns: minmax(0, 1fr) 700px; gap: 40px; align-items: center">
<div style="display: flex; flex-direction: column; gap: 28px; max-width: 520px">
<div style="display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 14px; font-weight: 500; color: #1652F0">The Become Engine</span>
<h2 id="st-title" style="margin: 0; font-size: 44px; line-height: 1.08; font-weight: 600; letter-spacing: -1.3px">Every journey starts with a vision. We build the rest.</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.55; color: #4A5578">Eight steps, each one built on the last, from knowing where you want to go to proving you got there.</p>
</div>
<div class="gy-swap" style="display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 14px; font-weight: 500; color: #8A93AD">Stage {{cur.n}} of 8 · <span style="color: #1652F0">{{cur.name}}</span></span>
<h3 style="margin: 0; font-size: 26px; line-height: 1.2; font-weight: 600; letter-spacing: -.4px">{{cur.headline}}</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #4A5578">{{cur.detail}}</p>
<dc-import name="Moment" stage="{{cur.n}}" hint-size="280px,150px"></dc-import>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<button class="gy-btn" type="button" onClick="{{prev}}" aria-label="Previous stage" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; border: 1.5px solid #D6DDEE; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B1433" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<button class="gy-btn" type="button" onClick="{{next}}" style="height: 44px; padding: 0 16px 0 18px; border-radius: 999px; background: #FFFFFF; border: 1.5px solid #D6DDEE; display: flex; align-items: center; gap: 8px; cursor: pointer; font-family: 'Google Sans', system-ui, sans-serif; font-size: 14px; font-weight: 600; color: #0B1433; white-space: nowrap">{{nextLabel}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B1433" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>
</div>

<div class="st-box" aria-label="Eight steps rising like a staircase">
<div class="st-world">
<sc-for list="{{tiles}}" as="r" hint-placeholder-count="8">
<button class="st-tile" type="button" onClick="{{r.pick}}" aria-pressed="{{r.pressed}}" aria-label="Stage {{r.n}}: {{r.name}}" style="left: {{r.x}}; top: {{r.y}}; transform: translateZ({{r.z}})">
<span class="st-side st-sa" style="height: {{r.h}}; background: {{r.sa}}"></span>
<span class="st-side st-sb" style="width: {{r.h}}; background: {{r.sb}}"></span>
<span class="st-top" style="background: {{r.top}}; border: 1.5px solid {{r.bd}}; box-shadow: {{r.glow}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{r.fg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg><span style="font-size: 11px; font-weight: 600; color: {{r.fg}}">{{r.name}}</span></span>
</button>
</sc-for>
</div>
<div class="st-world" aria-hidden="true">
<div class="st-bill" aria-hidden="true" style="left: {{door.x}}; top: {{door.y}}; transform: translateZ({{door.z}})">
<div class="st-up"><div class="st-door" style="width: 72px; height: 112px; margin: 0 0 0 -36px; border-radius: 36px 36px 6px 6px; background: linear-gradient(180deg, #FFF6E2 0%, #FFFFFF 100%); border: 3px solid #1652F0; box-sizing: border-box"></div></div>
</div>
<div class="st-bill" aria-hidden="true" style="left: {{you.x}}; top: {{you.y}}; transform: translateZ({{you.z}})">
<div class="st-up"><div class="st-orb" style="display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 0 0 0 -70px; width: 140px">
<span style="height: 30px; padding: 0 12px; border-radius: 999px; background: #0B1433; color: #FFFFFF; display: inline-flex; align-items: center; font-size: 13px; font-weight: 600; white-space: nowrap; box-shadow: 0 10px 20px -10px rgba(11,20,51,.6)">You · {{cur.name}}</span>
<span style="width: 40px; height: 40px; border-radius: 999px; background: radial-gradient(circle at 36% 30%, #A9C2FF 0%, #4C7DFF 40%, #1652F0 80%); box-shadow: 0 0 0 6px rgba(22,82,240,.15), 0 0 30px 6px rgba(22,82,240,.45)"></span>
</div></div>
</div>
</div>
</div>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":820}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { stage: 0 }; }
  componentDidMount() { this.startTimer(); }
  componentWillUnmount() { clearInterval(this.timer); }
  startTimer() {
    var self = this;
    clearInterval(this.timer);
    this.timer = setInterval(function () { self.setState({ stage: (self.state.stage + 1) % 8 }); }, 4600);
  }
  goTo(i) { this.setState({ stage: (i + 8) % 8 }); this.startTimer(); }
  renderVals() {
    var self = this;
    var eng = [
      ['Vision', 'Start with who you want to become.', 'Tell us your goal in your own words: a role, a skill, a career change.', 'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z'],
      ['Discover', 'See the possibilities ahead.', 'Explore the roles and skills linked to your goal, and the gap between today and where you want to be.', 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM15.5 8.5l-2 5-5 2 2-5z'],
      ['AI Coach', 'Turn your goal into a personal journey.', 'Your AI Coach maps the route and adapts it as you learn.', 'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z'],
      ['Learn', 'Build the knowledge you need.', 'Courses, lessons and resources from trusted creators and institutions.', 'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 5v16'],
      ['Practise', 'Turn knowledge into capability.', 'Projects, exercises and simulations, with feedback while you work.', 'M8 6l-6 6 6 6M16 6l6 6-6 6'],
      ['Connect', 'Learn with people when it matters.', 'Tutors, peers and experts who answer questions and review your work.', 'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21v-1a6 6 0 0 1 12 0v1M16 3.5a4 4 0 0 1 0 7M22 21v-1a6 6 0 0 0-4-5.6'],
      ['Prove', 'Show what you can actually do.', 'Verified work becomes evidence, kept in your Digital Backpack.', 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM8.5 12l2.5 2.5 4.5-5'],
      ['Advance', 'Use what you’ve proven to move forward.', 'A new role, the next level or a fresh goal. Then the engine starts again.', 'M7 17L17 7M9 7h8v8']
    ];
    var si = this.state.stage;
    var STEP = 34;
    var tiles = eng.map(function (s, k) {
      var on = k === si, done = k < si;
      return {
        n: k + 1, name: s[0], icon: s[3], pressed: on ? 'true' : 'false',
        x: ((k - 3.5) * 86) + 'px', y: (-(k - 3.5) * 18) + 'px', z: (k * STEP) + 'px', h: (k * STEP + 22) + 'px',
        top: on ? 'linear-gradient(150deg, #4C7DFF, #1652F0)' : (done ? 'linear-gradient(150deg, #FFFFFF, #EAF0FF)' : 'linear-gradient(150deg, #FFFFFF, #F7F9FD)'),
        bd: on ? '#1652F0' : (done ? '#C9D7FA' : '#E6EAF3'),
        sa: on ? '#1446D6' : (done ? '#C9D7FA' : '#E3E9F6'),
        sb: on ? '#0E3BB8' : (done ? '#B3C7F6' : '#D6DDEE'),
        fg: on ? '#FFFFFF' : (done ? '#1652F0' : '#8A93AD'),
        glow: on ? '0 0 40px 4px rgba(22,82,240,.45)' : 'none',
        pick: function () { self.goTo(k); }
      };
    });
    var px = function (k) { return { x: ((k - 3.5) * 86) + 'px', y: (-(k - 3.5) * 18) + 'px', z: (k * STEP + 40) + 'px' }; };
    var you = px(si), door = px(7);
    door.x = ((7 - 3.5) * 86 + 26) + 'px'; door.y = (-(7 - 3.5) * 18 - 26) + 'px'; door.z = (7 * STEP + 2) + 'px';
    var c = eng[si];
    return {
      tiles: tiles, you: you, door: door,
      cur: { n: si + 1, name: c[0], headline: c[1], detail: c[2] },
      nextLabel: si < 7 ? 'Next: ' + eng[si + 1][0] : 'Start again',
      next: function () { self.goTo(si + 1); },
      prev: function () { self.goTo(si - 1); }
    };
  }
}
</script>
</body>
</html>
