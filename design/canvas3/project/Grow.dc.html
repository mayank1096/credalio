<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose how you want to grow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
.gs-roll{position:relative;display:block;height:1.26em;overflow:hidden;transition:width .7s cubic-bezier(.7,0,.2,1)}
.gs-track{display:flex;flex-direction:column;transition:transform .7s cubic-bezier(.7,0,.2,1)}
.gs-track > span{display:block;width:max-content;height:1.26em;line-height:1.12em;white-space:nowrap}
.gs-line{position:absolute;left:0;right:0;bottom:.12em;height:.07em;border-radius:9px;background:#1652F0;transform-origin:left}
.gs-a .gs-line{animation:gsDrawA 1s cubic-bezier(.7,0,.2,1) both}
.gs-b .gs-line{animation:gsDrawB 1s cubic-bezier(.7,0,.2,1) both}
@keyframes gsDrawA{0%{transform:scaleX(0)}40%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes gsDrawB{0%{transform:scaleX(0)}40%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.gs-opt{height:48px;padding:0 18px 0 14px;border-radius:14px;border:1.5px solid #E6EAF3;background:#FFFFFF;display:inline-flex;align-items:center;gap:10px;font-family:'Google Sans',system-ui,sans-serif;font-size:15px;font-weight:500;color:#3A4566;cursor:pointer;white-space:nowrap;transition:border-color .25s ease,background .25s ease,color .25s ease}
.gs-opt:hover{border-color:#A9C2FF}
.gs-opt:focus-visible,.gs-cta:focus-visible{outline:3px solid rgba(22,82,240,.45);outline-offset:3px}
.gs-pane{position:absolute;inset:0;transition:opacity .6s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.gs-cta{transition:background .2s ease,transform .2s ease}
.gs-cta:hover{background:#0E3BB8 !important;transform:translateY(-1px)}
.gs-cta:hover .gs-arr{transform:translateX(3px)}
.gs-arr{transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.gs-ring{animation:gsSpin 18s linear infinite;transform-origin:50% 50%}
@keyframes gsSpin{to{transform:rotate(360deg)}}
.gs-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:gsPath 4.2s cubic-bezier(.6,0,.2,1) infinite}
@keyframes gsPath{0%{stroke-dashoffset:1}55%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.gs-ms{animation:gsMs 4.2s ease infinite;opacity:0}
@keyframes gsMs{0%{opacity:0;transform:translateY(8px)}15%,85%{opacity:1;transform:none}100%{opacity:0}}
.gs-dot{animation:gsDot 3.2s ease-in-out infinite}
@keyframes gsDot{0%,100%{background:#DCE5FB;transform:scale(1)}40%{background:#1652F0;transform:scale(1.12)}60%{background:#4C7DFF}}
.gs-fillbar{animation:gsFill 3.6s cubic-bezier(.6,0,.2,1) infinite}
@keyframes gsFill{0%{transform:scaleX(.08)}70%,100%{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){.gs-ring,.gs-draw,.gs-ms,.gs-dot,.gs-fillbar,.gs-a .gs-line,.gs-b .gs-line{animation:none !important}.gs-draw{stroke-dashoffset:0}.gs-ms{opacity:1}.gs-track,.gs-roll{transition:none}}
@media (max-width: 1080px){.gs-sent{font-size:72px !important}.gs-low{grid-template-columns:minmax(0,1fr) !important}.gs-art{height:300px !important}}
@media (max-width: 760px){
.gs-wrap{padding:72px 20px 64px !important;gap:28px !important}
.gs-sent{font-size:40px !important;letter-spacing:-1.3px !important}
.gs-roll{height:2.2em !important}
.gs-track > span{white-space:normal !important;width:auto !important;height:2.2em !important;line-height:1.1em !important;display:flex !important;align-items:flex-end}
.gs-opts{flex-wrap:nowrap !important;overflow-x:auto;margin:0 -20px;padding:0 20px 4px;scrollbar-width:none}
.gs-opts::-webkit-scrollbar{display:none}
.gs-name{font-size:40px !important}
.gs-art{height:260px !important}
.gs-big{font-size:96px !important}
.gs-guides{display:none}
.gs-four{display:none}
}
</style>
</helmet>
<section aria-labelledby="gs-h" style="position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Google Sans', system-ui, sans-serif; color: #0B1433">
<div class="gs-guides" aria-hidden="true" style="position: absolute; inset: 0; max-width: 1312px; margin: 0 auto; padding: 0 64px; box-sizing: border-box; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); pointer-events: none">
<span style="border-left: 1px solid #F0F3F9"></span><span style="border-left: 1px solid #F0F3F9"></span><span style="border-left: 1px solid #F0F3F9"></span><span style="border-left: 1px solid #F0F3F9; border-right: 1px solid #F0F3F9"></span>
</div>

<div class="gs-wrap" style="position: relative; max-width: 1312px; margin: 0 auto; padding: 120px 64px 112px; box-sizing: border-box; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; justify-content: space-between; align-items: center">
<h2 id="gs-h" style="margin: 0; font-size: 15px; font-weight: 500; color: #1652F0">Choose how you want to grow</h2>
<span class="gs-four" style="font-size: 14px; font-weight: 500; color: #8A93AD">Four ways to get there</span>
</div>

<p class="gs-sent {{lineCls}}" aria-live="polite" style="margin: 0; font-size: 104px; line-height: 1.04; font-weight: 600; letter-spacing: -4px">I want to <span class="gs-roll" style="width: {{rollW}}; color: #1652F0"><span class="gs-track" style="transform: translateY({{rollY}})"><sc-for list="{{opts}}" as="o" hint-placeholder-count="4"><span ref="{{o.ref}}">{{o.phrase}}<span style="color: #A9C2FF">.</span></span></sc-for></span><span class="gs-line"></span></span></p>

<div class="gs-opts" role="tablist" aria-label="Pick your goal" style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
<button class="gs-opt" type="button" role="tab" aria-selected="{{o.sel}}" onClick="{{o.pick}}" style="background: {{o.bg}}; border-color: {{o.bd}}; color: {{o.fg}}"><span style="font-size: 12px; font-weight: 500; color: {{o.num}}">0{{o.n}}</span>{{o.short}}<sc-if value="{{o.on}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1652F0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if></button>
</sc-for>
</div>

<div class="gs-low" style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 64px; align-items: end; margin-top: 24px; padding-top: 40px; border-top: 1px solid #E6EAF3">
<div style="display: flex; flex-direction: column; gap: 16px">
<span style="font-size: 14px; font-weight: 500; color: #8A93AD">Start with</span>
<span class="gs-name" style="font-size: 60px; line-height: 1; font-weight: 600; letter-spacing: -2px">{{cur.name}}</span>
<p style="margin: 0; max-width: 460px; font-size: 18px; line-height: 1.55; color: #4A5578">{{cur.detail}}</p>
<a class="gs-cta" href="#" style="align-self: flex-start; margin-top: 8px; height: 52px; padding: 0 6px 0 22px; border-radius: 999px; background: #1652F0; color: #FFFFFF; display: inline-flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 600; text-decoration: none">{{cur.cta}}<span style="width: 40px; height: 40px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg class="gs-arr" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#1652F0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></a>
</div>

<div class="gs-art" aria-hidden="true" style="position: relative; height: 340px">
<div class="gs-pane" style="opacity: {{p0.op}}; transform: {{p0.tf}}; display: flex; flex-direction: column; justify-content: flex-end; gap: 22px">
<div style="display: flex; align-items: flex-end; gap: 18px"><span class="gs-big" style="font-size: 200px; line-height: .8; font-weight: 600; letter-spacing: -10px; color: #1652F0">12</span><span style="padding-bottom: 6px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 28px; font-weight: 600; letter-spacing: -.6px">minutes</span><span style="font-size: 15px; color: #5B6582">a typical lesson</span></span></div>
<div style="height: 14px; border-radius: 999px; background: #EEF1F7; overflow: hidden"><span class="gs-fillbar" style="display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #A9C2FF, #1652F0); transform-origin: left"></span></div>
<div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 500; color: #8A93AD"><span>One skill</span><span>Your pace</span><span>Any device</span></div>
</div>

<div class="gs-pane" style="opacity: {{p1.op}}; transform: {{p1.tf}}; display: flex; align-items: center; justify-content: center">
<div style="position: relative; width: 320px; height: 320px">
<svg class="gs-ring" viewBox="0 0 320 320" style="position: absolute; inset: 0; width: 100%; height: 100%"><defs><path id="gsCirc" d="M160,160 m-132,0 a132,132 0 1,1 264,0 a132,132 0 1,1 -264,0"></path></defs><text font-family="Google Sans, system-ui, sans-serif" font-size="19" font-weight="600" letter-spacing="7" fill="#1652F0"><textPath href="#gsCirc">ASSESSED · VERIFIED · RECOGNISED · ASSESSED · VERIFIED · RECOGNISED ·</textPath></text></svg>
<div style="position: absolute; inset: 62px; border-radius: 999px; background: #1652F0; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 10px #EAF0FF, 0 30px 60px -24px rgba(22,82,240,.6)"><svg width="84" height="84" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></div>
</div>
</div>

<div class="gs-pane" style="opacity: {{p2.op}}; transform: {{p2.tf}}">
<svg viewBox="0 0 600 340" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible"><path d="M10 300 C 140 300, 150 200, 250 200 S 380 250, 430 160 S 520 60, 590 40" fill="none" stroke="#EAF0FF" stroke-width="22" stroke-linecap="round"></path><path class="gs-draw" pathLength="1" d="M10 300 C 140 300, 150 200, 250 200 S 380 250, 430 160 S 520 60, 590 40" fill="none" stroke="#1652F0" stroke-width="6" stroke-linecap="round"></path></svg>
<span class="gs-ms" style="position: absolute; left: 1.6%; top: 88%; margin-top: -17px; animation-delay: 0s"><span style="display: inline-flex; height: 34px; padding: 0 14px; border-radius: 999px; background: #0B1433; color: #FFFFFF; align-items: center; font-size: 14px; font-weight: 500">Today</span></span>
<span class="gs-ms" style="position: absolute; left: 41.6%; top: 58.8%; animation-delay: .7s"><span style="display: block; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 999px; background: #FFFFFF; border: 4px solid #1652F0; box-sizing: border-box"></span><span style="position: absolute; top: 18px; left: 0; transform: translateX(-50%); font-size: 14px; font-weight: 500; color: #3A4566; white-space: nowrap">Courses</span></span>
<span class="gs-ms" style="position: absolute; left: 71.6%; top: 47%; animation-delay: 1.3s"><span style="display: block; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 999px; background: #FFFFFF; border: 4px solid #1652F0; box-sizing: border-box"></span><span style="position: absolute; top: 18px; left: 0; transform: translateX(-50%); font-size: 14px; font-weight: 500; color: #3A4566; white-space: nowrap">Projects</span></span>
<span class="gs-ms" style="position: absolute; right: 0; top: 0; margin-top: -20px; animation-delay: 2s"><span style="display: inline-flex; height: 40px; padding: 0 16px; border-radius: 999px; background: #1652F0; color: #FFFFFF; align-items: center; font-size: 15px; font-weight: 600; box-shadow: 0 0 0 8px #EAF0FF">Data analyst</span></span>
</div>

<div class="gs-pane" style="opacity: {{p3.op}}; transform: {{p3.tf}}; display: flex; flex-direction: column; justify-content: flex-end; gap: 20px">
<div style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{crowd}}" as="c" hint-placeholder-count="36">
<span class="gs-dot" style="aspect-ratio: 1; border-radius: 999px; background: #DCE5FB; animation-delay: {{c.d}}; box-shadow: {{c.ring}}"></span>
</sc-for>
</div>
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap"><span style="font-size: 28px; font-weight: 600; letter-spacing: -.6px">Cohort 12 <span style="color: #8A93AD; font-weight: 500">· 36 learners</span></span><span style="font-size: 15px; color: #5B6582">Led by experts · live each week</span></div>
</div>
</div>
</div>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1040}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 2, flip: 0, widths: null };
    this.el = [];
    var self = this;
    this.refs4 = [0, 1, 2, 3].map(function (k) { return function (e) { self.el[k] = e; }; });
  }
  componentDidMount() {
    var self = this;
    var measure = function () { var w = self.el.map(function (e) { return e ? e.getBoundingClientRect().width : 0; }); var mob = window.innerWidth <= 760; if (w[0]) self.setState({ widths: mob ? null : w, mob: mob }); };
    this.measure = measure;
    setTimeout(measure, 60);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
    window.addEventListener('resize', measure);
    this.start();
  }
  componentWillUnmount() { clearInterval(this.timer); window.removeEventListener('resize', this.measure); }
  start() { var self = this; clearInterval(this.timer); this.timer = setInterval(function () { self.go((self.state.i + 1) % 4); }, 3400); }
  go(k) { if (k !== this.state.i) this.setState({ i: k, flip: 1 - this.state.flip }); }
  renderVals() {
    var self = this, i = this.state.i;
    var D = [
      ['pick up a new skill', 'New skill', 'Courses', 'Focused learning that builds one specific skill, at your own pace.', 'Browse courses'],
      ['prove I’m job-ready', 'Job-ready', 'Certifications', 'Assessed programs that confirm you meet a professional standard.', 'See certifications'],
      ['change careers', 'Career change', 'Career Paths', 'A sequenced route of learning, practice and credentials toward a role.', 'Find your path'],
      ['learn alongside others', 'With others', 'Programs', 'Structured, cohort-based learning led by experts or institutions.', 'Explore programs']
    ];
    var w = this.state.widths;
    var pane = function (k) { var on = k === i; return { op: on ? 1 : 0, tf: on ? 'none' : (k < i ? 'translateY(-24px)' : 'translateY(24px)') }; };
    var crowd = [];
    for (var c = 0; c < 36; c++) crowd.push({ d: ((c % 12) * 0.08 + Math.floor(c / 12) * 0.22).toFixed(2) + 's', ring: c === 17 ? '0 0 0 4px #FFFFFF, 0 0 0 6px #1652F0' : 'none' });
    return {
      opts: D.map(function (d, k) {
        var on = k === i;
        return { n: k + 1, phrase: d[0], short: d[1], on: on, sel: on ? 'true' : 'false', ref: self.refs4[k],
          bg: on ? '#EAF0FF' : '#FFFFFF', bd: on ? '#1652F0' : '#E6EAF3', fg: on ? '#0B1433' : '#3A4566', num: on ? '#1652F0' : '#8A93AD',
          pick: function () { self.go(k); self.start(); } };
      }),
      rollW: w ? w[i] + 'px' : 'auto', rollY: (-i * (this.state.mob ? 2.2 : 1.26)) + 'em',
      lineCls: this.state.flip ? 'gs-a' : 'gs-b',
      cur: { name: D[i][2], detail: D[i][3], cta: D[i][4] },
      p0: pane(0), p1: pane(1), p2: pane(2), p3: pane(3), crowd: crowd
    };
  }
}
</script>
</body>
</html>
